<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Hostelite</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="./CSS/style.css" />
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo-row">
        <img src="logo.png" alt="logo" />
        <span>HOSTELLITE</span>
      </div>
      <h2>Welcome back, hosteller!</h2>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@hostel.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <div class="error-msg" id="err"></div>
      <button class="auth-submit" onclick="doLogin()">Login</button>

      <div class="auth-switch">
        Don't have an account? <a href="signup.html">Sign up</a>
      </div>
    </div>
  </div>
  <script src="./JS/config.js"></script>
  <script src="./JS/auth.js"></script>
  <script>
    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('err');
      err.textContent = '';

      if (!email || !password) { err.textContent = 'Please fill all fields.'; return; }

      try {
        const res = await fetch('http://localhost:5000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) { err.textContent = data.msg; return; }

        localStorage.setItem('token', data.token);
        localStorage.setItem('firstname', data.firstname);
        window.location.href = 'index.html';
      } catch (e) {
        err.textContent = 'Server error. Try again.';
      }
    }
  </script>
</body>

</html>
