<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Share Recipe — Hostelite</title>
  <link rel="icon" type="image/png" href="logo.png"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a class="nav-logo" href="index.html">
        <img src="logo.png" alt="Hostelite Logo"/>
        <span>HOSTELLITE</span>
      </a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <div class="nav-dropdown" id="recipe-dropdown">
          <a href="javascript:void(0)">Recipe</a>
          <div class="dropdown-menu" id="my-recipes-dropdown">
            <div class="drop-header">My Recipes</div>
            <div class="drop-empty">Loading...</div>
          </div>
        </div>
        <a href="about.html">About</a>
      </div>
      <div class="nav-actions">
        <span id="nav-user-name" style="display:none; font-weight:700; color:var(--red); font-size:0.95rem;"></span>
        <button class="btn-solid" id="nav-logout-btn" style="display:none;" onclick="logout()">Logout</button>
        <button class="btn-outline" id="nav-signup-btn" onclick="location.href='signup.html'">Sign in</button>
        <button class="btn-solid"   id="nav-login-btn"  onclick="location.href='login.html'">Login</button>
      </div>
    </div>
  </nav>

  <!-- PAGE CONTENT STARTS -->
  <div class="page-content">

    <div class="upload-page">
      <h1>Share Your Recipe</h1>
      <p class="sub">Tell the world what you cooked in your hostel room tonight.</p>

      <div class="upload-card">
        <div class="form-group">
          <label>Recipe Title</label>
          <input type="text" id="title" placeholder="e.g. 2-Minute Maggi Upgrade"/>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="description" rows="3" placeholder="What's special about this recipe?"></textarea>
        </div>

        <div class="form-group">
          <label>Ingredients</label>
          <textarea id="ingredients" rows="4" placeholder="List your ingredients, one per line"></textarea>
        </div>

        <div class="form-group">
          <label>Steps</label>
          <textarea id="steps" rows="5" placeholder="Step 1: Boil water..."></textarea>
        </div>

        <div class="media-drop" id="media-drop">
          <input type="file" id="media-file" accept="image/*,video/*" onchange="previewMedia(this)"/>
          <div id="drop-label">📸 Click or drag to upload photo / video</div>
          <div class="media-preview" id="media-preview"></div>
        </div>

        <div class="progress-bar-wrap" id="prog-wrap">
          <div class="progress-bar" id="prog-bar"></div>
        </div>

        <div class="error-msg" id="upload-err"></div>
        <button class="upload-submit" onclick="submitRecipe()">🍳 Post Recipe</button>
      </div>
    </div>

  </div>
  <!-- PAGE CONTENT ENDS -->

  <!-- COOK CONNECT CONQUER -->
  <div class="ccc-banner">
    <p>Cook &nbsp;·&nbsp; Connect &nbsp;·&nbsp; Conquer</p>
  </div>

  <footer>
    &copy; 2026 <span>Hostelite</span>. Made with ❤️ by hostellers, for hostellers.
  </footer>
  
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/dropdown.js"></script>
</body>
</html>
